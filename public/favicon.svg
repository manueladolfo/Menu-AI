<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBA024" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C26546" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle with warm Mediterranean gradient -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Chef Hat Icon centered and styled -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Center top puff -->
    <circle cx="256" cy="180" r="90" />
    <!-- Left puff -->
    <circle cx="170" cy="225" r="76" />
    <!-- Right puff -->
    <circle cx="342" cy="225" r="76" />

    <!-- Body fill -->
    <polygon points="144,280 368,280 380,340 132,340" />

    <!-- Hat Base Band -->
    <rect x="132" y="325" width="248" height="82" rx="25" />
  </g>

  <!-- Accent line in the band -->
  <line x1="175" y1="366" x2="337" y2="366" stroke="#C26546" stroke-width="12" stroke-linecap="round" opacity="0.65" />

  <!-- Golden Sparkle (Culinary Inspiration) -->
  <path d="M 390 115 Q 390 145 420 145 Q 390 145 390 175 Q 390 145 360 145 Q 390 145 390 115 Z" fill="#FEF08A" />
</svg>