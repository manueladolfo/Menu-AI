<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBA024" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C25032" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full-Bleed 100% Background (no white border, occupies whole icon) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Prominent Chef Hat Icon centered (occupies 70% of canvas) -->
  <g filter="url(#glow)" fill="#FFFFFF">
    <!-- Center top puff -->
    <circle cx="256" cy="184" r="92" />
    <!-- Left puff -->
    <circle cx="164" cy="225" r="79" />
    <!-- Right puff -->
    <circle cx="348" cy="225" r="79" />

    <!-- Mid body fill -->
    <polygon points="118,271 394,271 374,333 138,333" />

    <!-- Hat Base Band -->
    <rect x="123" y="333" width="266" height="72" rx="22" />
  </g>

  <!-- Accent line in the band -->
  <line x1="146" y1="369" x2="366" y2="369" stroke="#C25032" stroke-width="13" stroke-linecap="round" opacity="0.8" />

  <!-- Golden Sparkle (Star) in top-right -->
  <path d="M 415 102 L 423 118 L 441 120 L 427 131 L 432 148 L 415 137 L 398 148 L 403 131 L 389 120 L 407 118 Z" fill="#FEF08A" />
</svg>